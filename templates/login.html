<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="GITAM No-Password Login Link Generator">
    <meta name="robots" content="noindex, nofollow">
    <title>My-GITAM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 0;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        .my-gitam-title {
            color: #2d5f5d;
            font-size: 28px;
            font-weight: normal;
            margin: 0;
        }

        .form-section {
            background-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-bottom: 1px solid #666;
            background-color: transparent;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-bottom-color: #2d5f5d;
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-group input:disabled {
            color: #999;
            cursor: not-allowed;
        }

        .login-btn {
            width: auto;
            padding: 12px 40px;
            background-color: #2d5f5d;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.3s;
            display: block;
            margin: 30px auto;
        }

        .login-btn:hover {
            background-color: #1f4442;
        }

        .login-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .footer-links a {
            color: #2d5f5d;
            text-decoration: none;
            font-size: 14px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Result modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #2d5f5d;
        }

        .modal-header h2 {
            color: #2d5f5d;
            font-size: 24px;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #666;
            line-height: 1;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .close-btn:hover {
            color: #000;
        }

        .result-section {
            margin: 20px 0;
        }

        .result-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .result-value {
            background-color: #f5f5f5;
            padding: 12px 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .link-value {
            background-color: #e8f5e9;
            border-left: 4px solid #2d5f5d;
        }

        .copy-btn-small {
            background-color: #2d5f5d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 5px;
        }

        .copy-btn-small:hover {
            background-color: #1f4442;
        }

        .copy-btn-small.copied {
            background-color: #4caf50;
        }

        .open-link-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #2d5f5d;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            text-align: center;
        }

        .open-link-btn:hover {
            background-color: #1f4442;
        }

        .error-message {
            background-color: #ffebee;
            color: #c62828;
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 4px solid #c62828;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <!-- GITAM Logo -->
            <img class="logo" src="https://login.gitam.edu/Images/gitam-Logo-new.png" alt="GITAM Logo">
            
            <h1 class="my-gitam-title">My-GITAM</h1>
        </div>

        <div class="form-section">
            <form id="loginForm" onsubmit="generateLink(event)">
                <div class="form-group">
                    <label for="userId">User ID</label>
                    <input 
                        type="text" 
                        id="userId" 
                        name="userId" 
                        required
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="login-btn" id="submitBtn">
                    Get No-Pass Link
                </button>
            </form>

            <div class="footer-links">
                <a href="#" onclick="alert('Feature not available'); return false;">Reset password</a>
                <a href="#" onclick="alert('Contact: '); return false;">Contact CATS</a>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✓ No-Password Login Link Generated</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <div id="modalBody">
                <!-- Content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        async function generateLink(event) {
            event.preventDefault();
            
            const userId = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            
            if (!userId) {
                alert('Please enter your User ID');
                return;
            }

            if (!password) {
                alert('Please enter your Password');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in to GITAM...';

            try {
                const response = await fetch('/generate-link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        user_id: userId,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showResult(data);
                } else {
                    showError(data.error || 'Failed to generate link');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Get No-Pass Link';
            }
        }

        function showResult(data) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="result-section">
                    <div class="result-label">User ID</div>
                    <div class="result-value">${escapeHtml(data.user_id)}</div>
                </div>

                <div class="result-section">
                    <div class="result-label">Encrypted ID</div>
                    <div class="result-value">${escapeHtml(data.encrypted_id)}</div>
                    <button class="copy-btn-small" onclick="copyText('${escapeHtml(data.encrypted_id)}', this)">
                        📋 Copy
                    </button>
                </div>

                <div class="result-section">
                    <div class="result-label">No-Password Login Link</div>
                    <div class="result-value link-value">${escapeHtml(data.login_link)}</div>
                    <button class="copy-btn-small" onclick="copyText('${escapeHtml(data.login_link)}', this)">
                        📋 Copy Link
                    </button>
                </div>

                <a href="${escapeHtml(data.login_link)}" target="_blank" class="open-link-btn">
                    🔗 Open Login Link
                </a>

                <div style="margin-top: 20px; padding: 15px; background-color: #e3f2fd; border-radius: 4px; font-size: 13px;">
                    <strong>ℹ️ How it works:</strong><br>
                    • We logged into GITAM with your credentials<br>
                    • Extracted the encrypted ID from the actual GITAM session<br>
                    • This link allows direct login without entering password again<br>
                    • Share this link to login from any device without password!
                </div>
            `;

            document.getElementById('resultModal').classList.add('active');
        }

        function showError(message) {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <div class="error-message">
                    <strong>Error:</strong> ${escapeHtml(message)}
                </div>
                <button class="open-link-btn" onclick="closeModal()">Close</button>
            `;
            document.getElementById('resultModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('active');
        }

        function copyText(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = '✓ Copied!';
                button.classList.add('copied');
                
                setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.onclick = function(event) {
            if (event.target === document.getElementById('resultModal')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
